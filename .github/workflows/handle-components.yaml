name: 🍒 Handle Components

on:
  workflow_dispatch:

  push:
    branches: ["main"]
    paths: [".cdq/components.yaml"]

  pull_request:
    branches: ["main"]
    paths: [".cdq/components.yaml"]

jobs:
  run:
    uses: cdqag/workflow-cdq/.github/workflows/handle-components-metadata.yaml@v2
    secrets:
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
